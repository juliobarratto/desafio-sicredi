services:
  postgres:
    image: postgres:16-alpine
    container_name: sicredi-postgres

    environment:
      POSTGRES_USER: sicredi
      POSTGRES_PASSWORD: sicredi
      POSTGRES_DB: sicredi
      
    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    
volumes:
  postgres_data: